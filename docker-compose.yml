services:
  api:
    build: ./backend
    ports:
      - "127.0.0.1:5080:5080" # this machine only: the API has no login
      - "[::1]:5080:5080"
    volumes:
      - ./backend:/src
      - ./data:/data

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
      - "[::1]:5173:5173" # localhost may resolve to ::1
    environment:
      API_PROXY_TARGET: http://api:5080
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api
